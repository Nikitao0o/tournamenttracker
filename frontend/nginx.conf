server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: любые неизвестные пути отдают index.html,
    # чтобы React Router обработал маршрут
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш статики
    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 7d;
        access_log off;
    }
}